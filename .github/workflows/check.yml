name: Check plugin
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugins/github/package-lock.json
      - run: node --test __test__/*.test.mjs
      - run: npm ci --ignore-scripts
        working-directory: plugins/github
      - run: npm run build
        working-directory: plugins/github
      - run: npm test
        working-directory: plugins/github
